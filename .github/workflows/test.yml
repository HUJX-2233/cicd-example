name: "打包vue项目"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  npm-build:
    runs-on: ubuntu-latest
    steps:
    - name: 读取仓库
      uses: actions/checkout@v4

    - name: 安装依赖
      run: npm install
    
    - name: 项目打包
      run: npm run build

    - name: 部署
      uses: jamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: dist

  
  
